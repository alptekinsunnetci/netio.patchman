# netio.patchman — Docker Compose yapılandırması
# Başlatmak için: docker compose up -d --build
name: netio-patchman

services:
  server:
    image: netio-patchman-server:latest
    build:
      context: .
      # Sürüm VERSION dosyasından okunur; değiştirmek için .env içinde
      # PATCHMAN_VERSION tanımlayın.
      args:
        VERSION: ${PATCHMAN_VERSION:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Istanbul
      PATCHMAN_DATA_DIR: /data
      # Konteyner içinde her zaman 8080 dinlenir. Dışarıya açılan port .env
      # içindeki PATCHMAN_PUBLISH_PORT ile değiştirilir.
      PATCHMAN_HTTP_ADDR: ":8080"
    volumes:
      - patchman-data:/data
    ports:
      - "${PATCHMAN_PUBLISH_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "netio.patchman/{{.Name}}"

volumes:
  patchman-data:
    name: netio-patchman-data
