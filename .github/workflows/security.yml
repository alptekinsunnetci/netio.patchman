name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays: new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # Latest patch release of the go.mod language version (standard library fixes).
  GO_VERSION: "1.26.x"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          check-latest: true
          go-package: ./...

  govulncheck-windows:
    name: Go vulnerabilities, Windows agent (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck for GOOS=windows
        env:
          GOOS: windows
        run: '"$(go env GOPATH)/bin/govulncheck" ./cmd/netio-patchman-agent/...'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high

  image-scan:
    name: Container image scan (Trivy)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netio-patchman-server:scan
          cache-from: type=gha
      - name: Scan the server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: netio-patchman-server:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
