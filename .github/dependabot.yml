version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
  - package-ecosystem: docker
    directories: ["/", "/deploy/updater"]
    schedule:
      interval: weekly
    labels: [dependencies]
