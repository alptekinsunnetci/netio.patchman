<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.N.Heading}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border:1px solid #e2e5ea;border-radius:6px;">
  <tr><td style="padding:16px 24px;border-bottom:1px solid #e2e5ea;font-size:15px;font-weight:600;">{{.Product}}</td></tr>
  <tr>
    <td style="padding:24px 24px 8px;">
      <h1 style="margin:0 0 4px;font-size:20px;line-height:1.3;">{{.N.Heading}}</h1>
      {{if .N.Body}}<p style="margin:0;font-size:14px;color:#4b5563;line-height:1.5;">{{.N.Body}}</p>{{end}}
    </td>
  </tr>
  {{if .N.Rows}}
  <tr>
    <td style="padding:16px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-collapse:collapse;">
        {{range .N.Rows}}<tr><td style="padding:6px 0;color:#6b7280;width:42%;vertical-align:top;">{{.Label}}</td><td style="padding:6px 0;{{if .Mono}}font-family:ui-monospace,Consolas,monospace;{{end}}">{{.Value}}</td></tr>{{end}}
      </table>
    </td>
  </tr>
  {{end}}
  {{if .N.Output}}
  <tr><td style="padding:0 24px 16px;"><pre style="margin:0;padding:10px 12px;background:#f9fafb;border:1px solid #e2e5ea;border-radius:4px;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;">{{.N.Output}}</pre></td></tr>
  {{end}}
  {{if .N.LinkURL}}
  <tr><td style="padding:8px 24px 24px;"><a href="{{.N.LinkURL}}" style="display:inline-block;padding:10px 16px;background:#0b5c8a;color:#ffffff;text-decoration:none;border-radius:4px;font-size:14px;font-weight:600;">{{.N.LinkText}}</a></td></tr>
  {{end}}
  <tr><td style="padding:12px 24px;border-top:1px solid #e2e5ea;font-size:12px;color:#6b7280;">{{t "email.footer" "product" .Product}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
