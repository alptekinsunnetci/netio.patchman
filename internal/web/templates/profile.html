{{define "body"}}{{template "shell" .}}{{end}}

{{define "content"}}
{{$root := .}}
<header class="pagehead">
  <div>
    <h1 class="pagehead__title">{{t "profile.title"}}</h1>
    <p class="pagehead__sub">{{.User.Name}} · {{.User.Email}} · {{roleLabel .User.Role}}</p>
  </div>
</header>
<section class="panel panel--narrow">
  <h2 class="panel__title">{{t "profile.change_password"}}</h2>
  <form class="form" method="post" action="/profile/password">
    {{template "csrf" $root}}
    <label class="field"><span class="field__label">{{t "profile.current_password"}}</span><input class="field__input" type="password" name="current_password" required autocomplete="current-password"></label>
    <label class="field"><span class="field__label">{{t "user.field.password"}}</span><input class="field__input" type="password" name="password" required minlength="10" autocomplete="new-password"><span class="field__hint">{{t "user.password_hint"}}</span></label>
    <label class="field"><span class="field__label">{{t "user.field.password_confirm"}}</span><input class="field__input" type="password" name="password_confirm" required minlength="10" autocomplete="new-password"></label>
    <div><button class="button button--primary" type="submit">{{t "profile.change_password"}}</button></div>
  </form>
</section>
{{end}}
